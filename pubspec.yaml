name: qr_studio
description: Create and scan QR codes.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  qr_flutter: ^4.1.0
  mobile_scanner: 5.2.3
  image_picker: ^1.1.2
  wifi_scan: ^0.4.1+1
  permission_handler: ^11.3.1
  share_plus: ^10.0.2
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0

flutter:
  uses-material-design: true
